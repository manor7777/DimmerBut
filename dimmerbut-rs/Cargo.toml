[package]
name = "dimmerbut"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi", "Win32_UI_Magnification", "Win32_Devices_Display", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Wmi",
    "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Com_StructuredStorage", "Win32_System_RemoteDesktop", "Win32_System_Rpc",
    "Win32_Security", "Win32_System_SystemInformation", "Foundation_Numerics",
] }
windows-numerics = "0.3.1"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
