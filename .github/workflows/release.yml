name: Release

# Builds a release exe on a Windows runner and publishes it as a GitHub release.
# Push a tag like v0.2.0, or run the workflow by hand and give it a tag name.
# The first release uses README.md plus the commit history as its notes; later
# releases use GitHub's generated notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dimmerbut-rs

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' dimmerbut-rs/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Build
        working-directory: dimmerbut-rs
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/DimmerBut-$env:TAG-windows-x64.zip"
          Compress-Archive -Path dimmerbut-rs/target/release/dimmerbut.exe, README.md -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Set-Content "$zip.sha256"

      - name: Write release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --limit 1 | grep -q .; then
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
            raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
            {
              sed "s#(docs/screenshots/#($raw/docs/screenshots/#g" README.md
              printf '\n## Changes\n\n'
              git log --no-merges --pretty='- %s' | grep -v '^- Update screenshots$'
            } > notes.md
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.first }}" = "true" ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --title "DimmerBut $TAG" --target "${{ github.sha }}" "${notes[@]}"
