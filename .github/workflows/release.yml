name: Release

# Builds a release exe on a Windows runner and publishes it as a GitHub release.
# Run it from the Actions tab: the version is the latest v* tag with the patch number
# bumped (or the Cargo.toml version if there are no tags yet), so nothing needs typing.
# The first release uses README.md as its notes; later releases use GitHub's
# generated notes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dimmerbut-rs

      - name: Work out the version
        shell: bash
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            version=$(grep -m1 '^version' dimmerbut-rs/Cargo.toml | cut -d'"' -f2)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          # Stamp the build with the release version (not committed).
          sed -i "0,/^version = .*/s//version = \"$version\"/" dimmerbut-rs/Cargo.toml

      - name: Build
        working-directory: dimmerbut-rs
        run: cargo build --release

      - name: Write release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --limit 1 | grep -q .; then
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
            raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
            sed "s#(docs/screenshots/#($raw/docs/screenshots/#g" README.md > notes.md
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.first }}" = "true" ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dimmerbut-rs/target/release/dimmerbut.exe --title "DimmerBut $TAG" --target "${{ github.sha }}" "${notes[@]}"
