name: Screenshots

# Builds the Rust app on a Windows runner, opens its windows with the --settings and
# --flyout test flags, captures them, and commits the PNGs to docs/screenshots.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: dimmerbut-rs
        run: cargo build --release

      - name: Capture screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type -TypeDefinition @"
          using System;
          using System.Drawing;
          using System.Runtime.InteropServices;
          public static class Win {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left, Top, Right, Bottom; }
              public delegate bool EnumProc(IntPtr hwnd, IntPtr lparam);
              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumProc proc, IntPtr lparam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetClassName(IntPtr hwnd, System.Text.StringBuilder name, int max);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetWindowText(IntPtr hwnd, System.Text.StringBuilder text, int max);
              public static string ClassOf(IntPtr hwnd) { var sb = new System.Text.StringBuilder(256); GetClassName(hwnd, sb, 256); return sb.ToString(); }
              public static string TextOf(IntPtr hwnd) { var sb = new System.Text.StringBuilder(256); GetWindowText(hwnd, sb, 256); return sb.ToString(); }
              public static IntPtr FindByClass(string cls) {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, l) => { if (ClassOf(h) == cls) { found = h; return false; } return true; }, IntPtr.Zero);
                  return found;
              }
              public static string ListAll() {
                  var sb = new System.Text.StringBuilder();
                  EnumWindows((h, l) => { sb.AppendLine(ClassOf(h) + " | " + TextOf(h)); return true; }, IntPtr.Zero);
                  return sb.ToString();
              }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
          }
          "@

          $out = Join-Path $env:GITHUB_WORKSPACE 'docs/screenshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dimmerbut-rs/target/release/dimmerbut.exe'

          function Save-Window($cls, $file) {
              $hwnd = [IntPtr]::Zero
              for ($i = 0; $i -lt 30 -and $hwnd -eq [IntPtr]::Zero; $i++) {
                  Start-Sleep -Seconds 1
                  $hwnd = [Win]::FindByClass($cls)
              }
              if ($hwnd -eq [IntPtr]::Zero) {
                  [Win]::ListAll() | Write-Host
                  $diag = Join-Path $env:GITHUB_WORKSPACE 'docs/diagnostics'
                  New-Item -ItemType Directory -Force $diag | Out-Null
                  $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                  $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
                  $g = [System.Drawing.Graphics]::FromImage($bmp)
                  $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
                  $bmp.Save((Join-Path $diag "desktop-$file"), [System.Drawing.Imaging.ImageFormat]::Png)
                  $g.Dispose(); $bmp.Dispose()
                  Get-Process dimmerbut -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle, Responding | Out-String | Write-Host
                  $log = Join-Path $env:APPDATA 'DimmerBut/error.log'
                  if (Test-Path $log) { Copy-Item $log $diag; Get-Content $log | Write-Host }
                  else { Write-Host 'No error.log' }
                  throw "Window $cls not found"
              }
              Start-Sleep -Seconds 2
              $r = New-Object Win+RECT
              [Win]::GetWindowRect($hwnd, [ref]$r) | Out-Null
              $w = $r.Right - $r.Left
              $h = $r.Bottom - $r.Top
              $bmp = New-Object System.Drawing.Bitmap $w, $h
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, [System.Drawing.Size]::new($w, $h))
              $bmp.Save((Join-Path $out $file), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose()
              $bmp.Dispose()
          }

          $app = Start-Process -FilePath $exe -ArgumentList '--settings' -PassThru
          try {
              Save-Window 'DimmerButSettings' 'settings.png'
          } finally {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

          $app = Start-Process -FilePath $exe -ArgumentList '--flyout' -PassThru
          try {
              Save-Window 'DimmerButFlyout' 'flyout.png'
          } finally {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            docs/diagnostics/*

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Update screenshots"
            git push
          fi
